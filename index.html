<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReelLove</title>
<meta name="description" content="ReelLove: a London dating app that matches you by the Reels you love. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #FFFFFF; --text: #16121A; --muted: #6B5F68; --accent: #E0245E; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161B30; --text: #F3F1FA; --muted: #C2C6DA; --accent: #B9A6FF; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 18px/1.5 Figtree, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  h1 { font: 800 clamp(44px, 12vw, 72px)/1 "Bricolage Grotesque", sans-serif; letter-spacing: -1.5px; margin: 0 0 12px; }
  h1 span { color: var(--accent); }
  p { margin: 0 0 8px; }
  .muted { color: var(--muted); font-size: 15px; margin-top: 24px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Reel<span>Love</span></h1>
  <p>Matched by the Reels you love. London, coming soon.</p>
  <p class="muted"><a href="privacy.html">Privacy policy</a> · <a href="mailto:hello@reellove.uk">hello@reellove.uk</a></p>
</main>
</body>
</html>
